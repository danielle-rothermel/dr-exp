[project]
name = "dr-exp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cachetools>=6.0.0",
    "fastapi>=0.115.12",
    "hydra-core==1.3",
    "pydantic>=2.11.5",
    "python-dotenv>=1.1.0",
    "supabase>=2.13.0",
    "uvicorn>=0.34.2",
    "websockets>=15.0.1",
    "portalocker>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
