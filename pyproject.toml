[project]
name = "dr-exp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cachetools>=6.0.0",
    "deconcnn",
    "fastapi>=0.115.12",
    "hydra-core==1.3.2",
    "lightning>=2.5.1.post0",
    "pandas>=2.3.0",
    "portalocker>=3.1.1",
    "pydantic>=2.11.5",
    "pytest-cov>=6.1.1",
    "pytest-xdist>=3.7.0",
    "python-dotenv>=1.1.0",
    "ruff>=0.11.13",
    "supabase>=2.13.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "uvicorn>=0.34.2",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.uv.sources]
deconcnn = { git = "https://github.com/drothermel/deconCNN" }

[tool.ruff]
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
