[project]
name = "dr-exp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cachetools>=6.0.0",
    "deconcnn",
    "fastapi>=0.115.12",
    "hydra-core==1.3.2",
    "lightning>=2.5.1.post0",
    "mypy>=1.16.0",
    "pandas>=2.3.0",
    "portalocker>=3.1.1",
    "pydantic>=2.11.5",
    "pytest-cov>=6.1.1",
    "pytest-xdist>=3.7.0",
    "python-dotenv>=1.1.0",
    "ruff>=0.11.13",
    "supabase>=2.13.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "types-cachetools>=6.0.0.20250525",
    "uvicorn>=0.34.2",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
]

[tool.uv.sources]
deconcnn = { git = "https://github.com/drothermel/deconCNN" }

[tool.ruff]
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.mypy]
# During architecture redesign, only check implementation files to avoid module conflicts
files = ["src/dr_exp/core/", "tests/implementation/"]
mypy_path = "src"
explicit_package_bases = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Ignore missing imports for libraries without type stubs
ignore_missing_imports = true

[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Markers
markers = [
    "supabase: marks tests as requiring local Supabase (deselect with '-m \"not supabase\"')",
    "slow: marks tests as slow running (deselect with '-m \"not slow\"')",
    "fast: marks tests as fast running (select with '-m \"fast\"')",
    "concurrency: marks tests that test concurrent behavior",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "edge_case: marks tests for edge case scenarios",
    "timeout: marks tests that include timeouts (very slow)"
]

# Logging (disabled by default for clean test output)
# Enable with: pytest --log-cli-level=INFO
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Warnings
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning"
]

# Coverage disabled during architecture redesign
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra"
]

# Asyncio configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
