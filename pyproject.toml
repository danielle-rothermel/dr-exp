[project]
name = "dr-exp"
version = "0.1.0"
description = "Local-first deep learning experiment manager for HPC clusters"
readme = "README.md"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "hydra-core==1.3.2",
    "omegaconf>=2.3.0",
    "pydantic>=2.11.5",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
trainers = [
    "lightning>=2.5.1.post0",
    "matplotlib>=3.10.3",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
]

[project.scripts]
dr_exp = "dr_exp.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.16.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.13",
    "tomlkit>=0.12.0",
    "types-pyyaml>=6.0.12.20250516",
]
test = [
    "pytest>=8.4.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
]

[tool.ruff]
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
line-length = 88
cache-dir = ".ruff_cache"
exclude = ["outputs/*", "notebooks/*"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint]
extend-select = [
    "A",
    "B", "FBT003",
    "C4", "C90",
    "F821",
    "INP",
    "N999",
    "NPY", "PD",
    "PERF",
    "PIE",
    "PLE",
    "PLW",
    "PLR",
    "PT",
    "PTH",
    "RUF",
    "S",
    "SLF",
    "SIM",
    "T10",
    "TID",
    "UP",
    "YTT",
    "ARG",
    "ANN",
    "COM",
    "D",
    "E",
    "F",
    "FA",
    "FLY",
    "ICN",
    "W",
]
ignore = [
    "ARG001",
    "COM812", "ISC001",
    "EXE",
    "FBT001", "FBT002",
    "I",
    "ICN002", "ICN003",
    "INT",
    "ISC",
    "LOG",
    "PLR0913",
    "S101",
    "TD",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D"]
"tests/**/*.py" = [
    "ARG",
    "PLR2004",
    "D103",
    "S106",
    "SLF001",
    "S101",
]
"**/scripts/**/*.py" = [
    "T201",
    "D101", "D102", "D103",
]
"*_notebook.py" = [
    "E402",
    "F401",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload", "typing.override"]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 20
max-statements = 80
max-nested-blocks = 8
max-returns = 10

[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"
"numpy.typing" = "npt"
pandas = "pd"
"matplotlib.pyplot" = "plt"
seaborn = "sns"
"dask.dataframe" = "dd"
polars = "pl"
lightning = "L"
"jax.numpy" = "jnp"

[tool.mypy]
exclude = ["notebooks/*"]
mypy_path = "src"
explicit_package_bases = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict = true
check_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_reexport = true
strict_equality = true
cache_dir = ".mypy_cache"
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow running (deselect with '-m \"not slow\"')",
    "fast: marks tests as fast running (select with '-m \"fast\"')",
    "concurrency: marks tests that test concurrent behavior",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "edge_case: marks tests for edge case scenarios",
    "timeout: marks tests that include timeouts (very slow)",
    "serial: marks tests that must run serially",
    "gpu: marks tests requiring GPU (deselect with '-m \"not gpu\"')",
]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--verbose",
    "-n",
    "auto",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@profile",
    "if _debug:",
    "if _profile:",
    "if torch.cuda.is_available()",
    "@torch.no_grad()",
    "if __name__ == .__main__.:",
    "def visualize",
    "except KeyboardInterrupt:",
    "@torch.jit.script",
    "@torch.jit.export",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
    "notebooks/*",
    "*/__init__.py",
    "*/config.py",
]
