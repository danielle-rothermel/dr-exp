_target_: dr_exp.trainers.decon_trainer.train_classification

# Dataset configuration
dataset: cifar10
num_classes: 10
batch_size: 32

# Machine configuration
machine:
  root_dir: /tmp/decon_test
  device: cpu

# Paths configuration
paths:
  data: ${machine.root_dir}/data
  logs: ${machine.root_dir}/logs
  my_data: ${paths.data}/test
  my_logs: ${paths.logs}/test
  run_dir: ${paths.my_logs}/run
  dataset_cache_root: ${paths.data}/cifar10/
  agg_results: ${paths.data}/run_results/

# Model configuration
model:
  architecture: alexnet
  num_classes: 10

# Data configuration  
data:
  name: cifar10
  num_workers: 1
  download: true
  data_split_seed: 1
  train_val_split_factor: 0.1

# Trainer configuration
trainer:
  max_epochs: 2
  limit_train_batches: 3
  accelerator: cpu
  devices: 1
  enable_checkpointing: true
  enable_progress_bar: false
  logger: false  # We use our own logger

# Optimizer configuration
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001

# Transform configuration
train_transforms:
  rcc: false
  hflip: false
  randaug: false
  colorjitter: false
  mixup: false
  cutmix: false
  normalize_mean: [0.4914, 0.4822, 0.4465]
  normalize_std: [0.2023, 0.1994, 0.2010]
  label_smoothing: 0.0

eval_transforms:
  rcc: false
  hflip: false
  randaug: false
  colorjitter: false
  mixup: false
  cutmix: false
  normalize_mean: [0.4914, 0.4822, 0.4465]
  normalize_std: [0.2023, 0.1994, 0.2010]
  label_smoothing: 0.0

# Other deconCNN settings
proj_dir_name: test_integration
seed: 0
train: true
eval: false
epochs: 2
limit_train_batches: 3
loss: cross_entropy
log_every: 1
enable_checkpointing: true