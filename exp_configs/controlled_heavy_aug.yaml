_target_: "dr_exp.trainers.decon_trainer.train_classification"
# Controlled experiment with heavy augmentation for comparison

defaults:
  - controlled_base
  - _self_

run_name: controlled_heavy_aug

# Override to add heavy augmentations
train_transforms:
  rcc: true
  hflip: true
  randaug: true       # ON
  colorjitter: true
  mixup: true         # ON
  cutmix: true        # ON
  normalize_mean: [0.4914, 0.4822, 0.4465]
  normalize_std: [0.2023, 0.1994, 0.2010]
  rcc_scale_min: 0.7  # More aggressive
  rcc_init_size: 32
  colorjitter_brightness: 0.2  # Full strength
  colorjitter_contrast: 0.2    
  colorjitter_saturation: 0.2  
  colorjitter_hue: 0.1        
  label_smoothing: 0.1         # ON
  mixup_alpha: 1.0
  cutmix_alpha: 1.0

# May need lower LR with heavy aug
optim:
  lr: 0.05  # Lower than base 0.1