_target_: "dr_exp.trainers.decon_trainer.train_classification"
# Controlled experiment: AdamW optimizer

defaults:
  - controlled_base
  - override /optim: adamw
  - _self_

run_name: controlled_adamw

# Override optimizer to use better HP for AdamW
optim:
  lr: 0.003  # Higher than default 0.001
  weight_decay: 0.001  # Lower than default 0.01