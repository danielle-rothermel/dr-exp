repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff-check
        name: Run ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Run ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: mypy
        name: Run mypy
        entry: uv run mypy src/ && uv run mypy scripts/ && uv run mypy tests/
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: Run tests with uv
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [commit]
