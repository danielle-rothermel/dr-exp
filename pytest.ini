[tool:pytest]
# Pytest configuration for dr_exp

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    supabase: marks tests as requiring local Supabase (deselect with '-m "not supabase"')
    slow: marks tests as slow running (deselect with '-m "not slow"')
    fast: marks tests as fast running (select with '-m "fast"')
    concurrency: marks tests that test concurrent behavior  
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    edge_case: marks tests for edge case scenarios
    timeout: marks tests that include timeouts (very slow)

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

# Coverage
addopts = 
    --strict-markers
    --strict-config
    -ra
    --cov=dr_exp
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Asyncio mode
asyncio_mode = auto

# Parallel execution settings
# Use auto to detect available cores, or specify -n NUM
# For fast tests: pytest -n auto -m "fast"
# For slow tests: pytest -n auto -m "slow" 
# Skip timeout tests: pytest -n auto -m "not timeout"