# Minimal augmentation for fast testing
rcc: false  # Disable RandomResizedCrop for speed
hflip: true  # Keep basic horizontal flip
randaug: false  # Disable RandAugment for speed
colorjitter: false  # Disable ColorJitter for speed
mixup: false  # Disable Mixup for speed
cutmix: false  # Disable CutMix for speed

# Basic normalization (CIFAR-10 stats)
normalize_mean: [0.4914, 0.4822, 0.4465]
normalize_std: [0.2023, 0.1994, 0.2010]

# Simplified parameters
label_smoothing: 0.0
rcc_scale_min: 1.0
rcc_init_size: 32